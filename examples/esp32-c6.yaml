# Example GPIOs only: keep the pins from your working installation.
esphome:
  name: zenner-nfc
  friendly_name: Zenner water meter

esp32:
  board: esp32-c6-devkitc-1
  framework:
    type: esp-idf

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

logger:
  level: INFO

external_components:
  - source:
      type: local
      path: ../components
    components: [zenner_nfc]

spi:
  id: nfc_spi
  clk_pin: GPIO6
  mosi_pin: GPIO4
  miso_pin: GPIO5
  interface: hardware

# ESP32-C6-DevKitC-1 onboard WS2812 RGB LED.
light:
  - platform: esp32_rmt_led_strip
    id: nfc_status_led
    pin: GPIO8
    num_leds: 1
    chipset: WS2812
    channel_colors: GRB
    internal: true
    restore_mode: ALWAYS_OFF
    default_transition_length: 0s

zenner_nfc:
  spi_id: nfc_spi
  id: water_meter
  update_interval: 60s
  pn5180_dpc: preserve  # Set disabled for DPC-off testing; enabled restores DPC.
  consecutive_errors_limit: 3
  cs_pin: GPIO7
  pn5180_busy_pin: GPIO10
  pn5180_rst_pin: GPIO11
  volume:
    name: Meter volume
    disabled_by_default: true
  forward_volume:
    name: Water consumption
  reverse_volume:
    name: Reverse volume
    disabled_by_default: true
  flow:
    name: Water flow
    unit_of_measurement: L/min
  water_temperature:
    name: Water temperature
  ambient_temperature:
    name: Ambient temperature
  read_success:
    name: Last read successful
  status:
    name: Read status
    on_value:
      then:
        - lambda: |-
            auto call = id(nfc_status_led).turn_on();
            call.set_brightness(0.10f);
            if (x == "ok") {
              call.set_rgb(0.0f, 1.0f, 0.0f);
            } else if (x == "initializing PN5180" || x == "ready" || x == "reading") {
              call.set_rgb(1.0f, 1.0f, 0.0f);
            } else {
              call.set_rgb(1.0f, 0.0f, 0.0f);
            }
            call.perform();
  # Optional diagnostics (may contain identifying meter data):
  # uid:
  #   name: NFC UID
  # raw_response:
  #   name: Raw response

button:
  - platform: template
    name: Read water meter
    entity_category: diagnostic
    on_press:
      - component.update: water_meter
